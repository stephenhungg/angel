<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' ws: wss: https: blob: data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Cherry+Bomb+One&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>angel</title>
    <style>
      :root {
        color-scheme: dark;

        --angel-accent: #ff7eb6;
        --angel-accent-soft: #ff7eb633;
        --angel-bg-0: #0d0a14;
        --angel-bg-1: #160f22;
        --angel-bg-2: #1f1530;
        --angel-fg: #f5e6ff;
        --angel-fg-muted: #c8b4dd;
        --angel-glow: 0 0 24px rgba(255, 126, 182, 0.45);

        --font-display: 'Bagel Fat One', 'Cherry Bomb One', system-ui, sans-serif;
        --font-bubble: 'Cherry Bomb One', 'Bagel Fat One', sans-serif;
        --font-ui: 'DM Mono', ui-monospace, monospace;
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: radial-gradient(ellipse at top, var(--angel-bg-1), var(--angel-bg-0) 60%);
        color: var(--angel-fg);
        font-family: var(--font-ui);
        overflow: hidden;
        user-select: none;
        -webkit-app-region: no-drag;
      }

      .titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 32px;
        -webkit-app-region: drag;
        z-index: 1000;
        pointer-events: none;
      }

      canvas {
        outline: none;
      }

      ::selection {
        background: var(--angel-accent-soft);
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
